        <header>

        <main>
            <section class="contato">
                <div class="formulario">
                    <form action="#" method="post">
                        <div class="text">
                            <h2>Contate-nos</h2>
                            <h3>Precisa tirar alguma dúvida?</h3>
                        </div>
                        <div id="input">
                            <label for="nome">Nome</label>
                            <input name="nome" type="text" placeholder="Digite seu nome aqui">
                        </div>
                        <div id="input">
                            <label for="email">E-mail</label>
                            <input name="email" type="text" placeholder="nome@exemplo.com">
                        </div>
                        <div id="input">
                            <label for="message">Mensagem</label>
                            <textarea name="message" placeholder="Escreva a sua mensagem aqui"></textarea>
                        </div>
                        <button>Enviar</button>
                                                <div class="social">
                            <a href="#"><img width="25px" src="../Assets/Imgs/Social/twitter.png" alt="twitter"></a>
                            <a href="#"><img width="25px" src="../Assets/Imgs/Social/tiktok.png" alt="tiktok"></a>
                            <a href="#"><img width="25px" src="../Assets/Imgs/Social/snapchat.png" alt="snapchat"></a>
                            <a href="#"><img width="25px" src="../Assets/Imgs/Social/pinterest.png" alt="pinterest"></a>

                    </form>
                </div>
